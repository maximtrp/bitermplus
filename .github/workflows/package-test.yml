name: Package Test

on:
  push:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install package and linters
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test] ruff prospector
    - name: Ruff
      run: ruff check .
    - name: Prospector
      run: prospector --messages-only

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      env:
        CYTHON_COVERAGE: "1"
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
    - name: Testing package with pytest
      run: |
        pytest -s -m "slow"
        pytest -s -m "not slow" --cov=src/bitermplus --cov-report=term-missing
