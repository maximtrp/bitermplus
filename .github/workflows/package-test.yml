name: Package Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and linters
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] ruff prospector pylint
      - name: Ruff
        run: ruff check .
      - name: Prospector
        run: prospector --messages-only
      - name: Pylint
        run: pylint --rcfile=.pylintrc src/bitermplus tests

  build:
    runs-on: ${{ matrix.os }}
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        env:
          CYTHON_COVERAGE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Testing package with pytest
        run: |
          pytest -s -m "slow"
          pytest -s -m "not slow" --cov=src/bitermplus --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codacy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
